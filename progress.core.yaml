    depends_on: [CORE-18, CORE-19]
    summary: >
      Tie the expression grammar (CORE-09/CORE-11 for ngspice, CORE-10/
      CORE-12 for Xyce) to the scope chains built in CORE-18/CORE-19: walk
      every `Expr::Ident` appearing in a `.param` RHS, `.model` parameter,
      device instance parameter, or `.func` body, and resolve it against
      the applicable scope chain for its dialect and lexical position,
      producing an "undefined parameter" diagnostic for anything that
      resolves to nothing AND is not one of: a built-in function name
