      owner: coder-agent
      paths:
        - servers/core/src/expr/ngspice_runtime.rs
      acceptance:
        - "parse_ngspice_runtime(tokens) accepts V(node) and V(node1,node2) and I(devname) as Reference expressions, and accepts bare `time`, `temper`, `hertz` identifiers as special references — all of which CORE-09's compile-time parser rejects."
        - "parse_ngspice_runtime(tokens) does NOT include `tanh` in its accepted built-in function list, even though CORE-09's compile-time parser does — an input using `tanh(x)` here produces a Call that a later semantic pass flags as unknown, matching the documented function-set gap in docs/GRAMMAR.md §5.1."
        - "`pow(x1,x2)`, `x1**x2`, and `x1^x2` all parse to the SAME tagged BinaryOp/Call variant here, distinct from the tag CORE-09 uses for its compile-time `pow`/`**`/`^`, so a later evaluation pass can apply this parser's sign-discarding semantics (`pow(fabs(x1),x2)`) instead of CORE-09's compile-time formula — the AST tag itself must encode which grammar produced it."
        - "`pwr(x1,x2)` parses to a distinct Call tag from `pow`/`**`/`^`, preserving the sign-vs-no-sign distinction structurally."
        - "The unit-step family `u(x)`, `u2(x)`, `uramp(x)` parse as 1-arg Calls."
        - "`pwl(controlling_expr, x0,y0, x1,y1, ...)` parses as a Call whose first argument is a full sub-expression (not just a bare identifier) and whose remaining arguments are an even-length flat list of x,y pairs; a malformed odd-length pair list produces a diagnostic-carrying error, not a panic."
