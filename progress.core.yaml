      statement came from. The epic's core promise ("diagnostics carry
      file identity") is unmet. Fix needs: either (a) thread FileId through
      Statement (a real AST shape change touching CORE-02/05/07's output),
      or (b) keep a side-table mapping LineSpan-plus-statement-identity
      back to FileId and have each symbols::* diagnostic type look it up.
      Option (b) avoids re-touching the already-complete CORE-02/05/07
      contracts but needs a stable way to correlate a Statement back to its
      origin after cloning — worth deciding deliberately, not just patching.
