  - id: CORE-10
    title: Xyce unified expression parser
    area: xyce-expr
    status: complete
    review: >
      Retested 2026-07-31. servers/core/src/expr/xyce.rs tests pass.
      Confirmed the false-cognate divergence from CORE-09: `^` parses to a
      BinaryOp tagged "^" at XOR precedence (bp 3/4, below `&`), `**` is the
      sole power operator at the tightest binary precedence; `&`/`|`/`~` are
      single-char boolean ops. test_ternary_low_precedence_matches_c_gotcha_example
      reproduces the exact docs/GRAMMAR.md §4.3 example
      (`1+a==b?1:0+1` parses with else_branch = `0+1` as a whole). Full
      Xyce built-in list parses with correct arity including both LIMIT
      arities as distinct forms; LOG/LOG10 vs LN tagged distinctly.
      Hierarchical node-path `:` inside V() references parses as part of
      the reference, not a ternary collision. Gate: cargo fmt clean, cargo
      clippy -D warnings clean, 227/227 cargo test pass.
    depends_on: [CORE-08]
    summary: >
      Implement a precedence-climbing parser for Xyce's single unified
      expression grammar (docs/GRAMMAR.md §4.3/§4.4), used across
      `.param`/`.global_param`/`.func`/B-sources/`.print`. Encodes Xyce's
      distinct operator set — critically `^` means **boolean XOR** here,
      NOT power (only `**` is power; this is the false-cognate divergence
      from CORE-09 flagged in docs/GRAMMAR.md §4.3), `&`/`|`/`~` are
      boolean and/or/not (not `&&`/`||`), and the ternary `c?x:y` has very
      low precedence matching C's, with the documented `:`-collision
      lint case deferred to CORE-13. Also implements Xyce's `+` operator
      double duty (numeric add vs. string concatenation, resolved
      structurally by operand type where knowable, otherwise left
      ambiguous for a later semantic pass) and the Xyce built-in function
      list (ABS, CEIL, DDT, DDX, FLOOR, FMOD, IF, INT, LIMIT-3arg, M,
      MIN, MAX, NINT, PWR, POW, PWRS, SDT, SGN, SIGN, STP, SQRT, URAMP,
      trig/hyperbolic set, LOG/LOG10/LN, complex-number ops DB/IMG/PH/R/RE,
      random ops AGAUSS/GAUSS/AUNIF/UNIF/LIMIT-2arg/RAND, and the
      SPICE_EXP/SPICE_PULSE/SPICE_SFFM/SPICE_SIN compatibility functions).
    implementation:
      owner: coder-agent
      paths:
        - servers/core/src/expr/xyce.rs
      acceptance:
        - "parse_xyce(tokens) treats `^` as boolean XOR (a BinaryOp distinct from the power operator) and `**` as the sole power operator — this must differ observably from CORE-09's ngspice parser given the same `^` input token."
        - "parse_xyce(tokens) accepts `&`, `|`, `~` as boolean and/or/not (not `&&`/`||`/`!`), per docs/GRAMMAR.md §4.3's Xyce operator table."
        - "The ternary operator parses at the lowest precedence, matching the documented gotcha: `1+a==b?1:0+1` parses as `IF(1+a==b, 1, 0+1)`, i.e. the whole `0+1` is the else-branch, not `(1+a==b?1:0)+1`."
        - "Every function name in the Xyce built-in list above is accepted as a Call with correct arity where fixed (e.g. DDX takes 2 args: an expression and a variable; LIMIT accepts both a 2-arg random form and a 3-arg deterministic-clamp form, and the parser preserves which arity was used since they mean different things per docs/GRAMMAR.md §4.3)."
        - "`LOG`/`LOG10` parse as Calls tagged distinctly from `LN`, preserving the base-10-vs-natural-log distinction at the AST level (this parser does not resolve the `-hspice-ext math` runtime flag — that's a later semantic-pass concern; the AST must retain enough information for that pass to act on)."
        - "A hierarchical node-path token containing `:` (e.g. as it would appear inside a `V(...)` reference like `V(Xmain:Xnot1:A)`) is tokenized/parsed as part of the reference argument, not misinterpreted as a ternary colon — this is the non-ambiguous case; the genuinely ambiguous bare-identifier-left-of-`:` case is CORE-13's diagnostic, not a parse-time behavior change here."
