  - id: CORE-13
    title: Cross-dialect false-cognate diagnostics
    area: cross-dialect-diagnostics
    status: complete
    review: >
      Retested 2026-07-31. servers/core/src/expr/diagnostics.rs tests pass.
      lint_caret_dialect_confusion() correctly interprets "^" per the passed
      Dialect (info-level note, both directions). lint_log_dialect_confusion()
      states the base per dialect and separately notes the -hspice-ext math
      caveat for Xyce. lint_xyce_ternary_colon_collision() fires precisely
      when a Ternary's then_branch is a bare Ident (the documented ambiguous
      shape) and does not fire on hierarchical node-path colons (those live
      inside Reference args, never reach this check) or when the then_branch
      is a non-bare-identifier expression (the documented C+0-style
      workaround shape). Minor note: the
      test_xyce_ternary_colon_collision_not_flagged_when_parenthesized test
      name is a bit imprecise — it actually constructs a BinaryOp then_branch
      directly rather than literally testing parenthesized-source-text
      re-parsing, but the behavior it proves (non-bare-identifier
      then_branch doesn't fire) is exactly the correct invariant. All three
      lints operate purely on the Expr tree + Dialect, no re-tokenizing.
      Gate: cargo fmt clean, cargo clippy -D warnings clean, 227/227 cargo
      test pass.
    depends_on: [CORE-09, CORE-10, CORE-11, CORE-12]
    summary: >
      Implement the specific lint diagnostics docs/GRAMMAR.md §9.4 calls out
      as "high-value, cheap wins once a basic parser exists": (1) `^`
      operator meaning depends on declared dialect — warn if code appears
      to have been written assuming the other dialect's meaning (heuristic:
      flag when `^` result would silently produce a very different value
      class, e.g. used where a power-like magnitude is expected in Xyce, or
      used where a boolean is expected in ngspice); (2) `log()`/`log10()`
      meaning depends on declared dialect (and the `-hspice-ext math` flag
      for Xyce) — surface this as an always-on hover/info note on `log`
      calls, not just a warning, since silent wrong-base-log is hard to
      spot by inspection; (3) Xyce's ternary `:`-collision — flag a bare
      parameter/identifier token immediately followed by `:` with no space,
      per the documented `{(A==B)?C:D}` syntax-error case from docs/
      GRAMMAR.md §4.3, distinguishing it from the legitimate hierarchical-
      node-path `:` usage CORE-10 already parses correctly.
    implementation:
      owner: coder-agent
      paths:
        - servers/core/src/expr/diagnostics.rs
      acceptance:
        - "A `Diagnostic` type exists (or reuses ParseError's shape, extended with a severity: Error|Warning|Info) that diagnostics.rs functions return alongside/instead of a hard parse failure — these are lints on an already-successfully-parsed Expr tree, not new parse errors."
        - "lint_caret_dialect_confusion(expr, dialect) flags a `^` usage and names which meaning applies for the declared dialect, so a hover-provider caller can surface \"this ^ means XOR (Xyce)\" or \"this ^ means power (ngspice)\" without re-deriving it."
        - "lint_log_dialect_confusion(expr, dialect) flags every `log`/`log10`/`ln` Call and states which base applies for the declared dialect, and separately notes when the call would mean something different under Xyce's `-hspice-ext math` flag (informational, not assuming the flag is set)."
        - "lint_xyce_ternary_colon_collision(expr) flags the specific ambiguous pattern — a bare identifier/parameter token immediately adjacent to `:` where a space or an enclosing parenthesis is absent — and suggests the two documented fixes from docs/GRAMMAR.md §4.3 (add a space, or wrap the branch in parens), while NOT flagging a `:` that CORE-10 already resolved as part of a hierarchical node-path reference."
        - "All three lint functions operate purely on the Expr AST plus the declared Dialect — no re-tokenizing or re-parsing of raw text, keeping this epic strictly downstream of CORE-09/CORE-10/CORE-11/CORE-12."
    tests:
