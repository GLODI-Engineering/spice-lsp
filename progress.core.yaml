      owner: coder-agent
      paths:
        - servers/core/src/expr/diagnostics.rs
      acceptance:
        - "A `Diagnostic` type exists (or reuses ParseError's shape, extended with a severity: Error|Warning|Info) that diagnostics.rs functions return alongside/instead of a hard parse failure — these are lints on an already-successfully-parsed Expr tree, not new parse errors."
        - "lint_caret_dialect_confusion(expr, dialect) flags a `^` usage and names which meaning applies for the declared dialect, so a hover-provider caller can surface \"this ^ means XOR (Xyce)\" or \"this ^ means power (ngspice)\" without re-deriving it."
        - "lint_log_dialect_confusion(expr, dialect) flags every `log`/`log10`/`ln` Call and states which base applies for the declared dialect, and separately notes when the call would mean something different under Xyce's `-hspice-ext math` flag (informational, not assuming the flag is set)."
