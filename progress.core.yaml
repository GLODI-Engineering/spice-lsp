  - id: CORE-08
    title: Expression AST types + shared tokenizer
    area: expression-lexical
    status: planned
    depends_on: [CORE-02]
    summary: >
      Introduce the Expr AST and a shared expression tokenizer, consumed by
      the per-dialect parsers in CORE-09/CORE-10. Covers docs/GRAMMAR.md §2
      (numbers/units) and the lexical parts of §4.3 (operators as raw
      tokens, not yet given per-dialect meaning) and §5 (V()/I() reference
      call syntax, string literals for TABLE file-load forms). This epic
      does NOT resolve what an operator means (e.g. whether `^` is power or
      XOR) — it only tokenizes; per-dialect meaning is CORE-09/CORE-10's
      job, per the AGENTS.md architecture invariant. Input to this tokenizer
      is the raw expression text already captured as raw params/body strings
      by CORE-05/CORE-07 (e.g. `Param.assignments` RHS, `Func.body`,
      `ElementInstance.raw_params` entries for B/E/G sources).
    implementation:
      owner: coder-agent
      paths:
        - servers/core/src/expr/ast.rs
        - servers/core/src/expr/token.rs
        - servers/core/src/expr/mod.rs
        - servers/core/src/lib.rs
      acceptance:
        - "An `Expr` AST enum exists with at least: Number(f64, Option<String> raw_suffix), Ident(String), StringLit(String), Call(name: String, args: Vec<Expr>), BinaryOp(op: String, lhs, rhs), UnaryOp(op: String, operand), Ternary(cond, then, else), Reference(kind: V|I|N, args: Vec<String>) for V()/I()/N() node/current references."
        - "tokenize() recognizes a SPICE numeric literal with scale suffix (docs/GRAMMAR.md §2 table: T,G,Meg,K,mil,m,u,n,p,f,a, plus Xyce's X=Meg alias) and separates it from a following bare identifier, e.g. `10k` tokenizes as one number token, `10 kOhms` as a number token then an identifier token."
        - "tokenize() recognizes multi-character operators as single tokens without ambiguity: `**`, `==`, `!=`, `<=`, `>=`, `&&`, `||` are each one token, not two single-char tokens glued together."
        - "tokenize() recognizes `?` and `:` as distinct single-char operator tokens even when not surrounded by whitespace, e.g. `a?b:c` tokenizes identically to `a ? b : c` — this directly addresses the ngspice \"space before ?\" gotcha from docs/GRAMMAR.md §5.1 by making the tokenizer robust to the no-space form rather than relying on user-supplied whitespace."
        - "tokenize() recognizes a `name(` sequence (no space before the paren) as the start of a function-call/reference token distinct from a bare identifier followed by a parenthesized sub-expression — both parse to the same shape (Call), but the distinction matters for V(1,2) vs a hypothetical `x * (y)`."
        - "tokenize() recognizes double-quoted string literals for file-load forms (e.g. `tablefile(\"file.dat\")`), including the no-quote-escaping-needed common case; does not attempt full string-escape-sequence support beyond docs/GRAMMAR.md's documented examples."
        - "tokenize() returns a diagnostic-carrying error (not a panic) for unterminated string literals and unrecognized characters, with the offending byte offset."
    tests:
      owner: tester-agent
      paths:
        - servers/core/src/expr/token.rs   # #[cfg(test)] mod tests
      acceptance:
        - "one test per numeric-suffix case from docs/GRAMMAR.md §2's table, both dialects, including Xyce's X=Meg alias and the absence of a-suffix by default"
        - "test_decorative_trailing_letters_ignored (10V, 10Hz, 10Volts all number 10)"
        - "test_multi_char_operators_not_split (**, ==, !=, <=, >=, &&, ||)"
        - "test_ternary_no_space_before_question_mark"
        - "test_function_call_vs_grouped_subexpression"
        - "test_string_literal_in_tablefile_call"
        - "test_unterminated_string_literal_returns_diagnostic_not_panic"
        - "test_unrecognized_character_returns_diagnostic_with_offset"
        - "edge case: empty expression string"
        - "edge case: expression that is only whitespace"

  - id: CORE-09
    title: ngspice compile-time expression parser (parser #1)
    area: ngspice-expr-compiletime
    status: planned
    depends_on: [CORE-08]
    summary: >
      Implement a precedence-climbing (Pratt) parser for ngspice's
      compile-time expression grammar (docs/GRAMMAR.md §4.3, the grammar
      used by `.param`, `.func`, brace-expressions, and subcircuit
      parameter defaults — "parser #1" in the ngspice multi-grammar split
      from §0/§9.1). Encodes ngspice's specific 8-level precedence table,
      its operator set (`** ^` both mean power; `&& || !` boolean; no `&`
      single-char boolean-and), and its compile-time built-in function list
      (sqrt, sin, cos, tan, asin, acos, atan, sinh, cosh, tanh, asinh,
      acosh, atanh, arctan, exp, ln, log, log10, abs, nint, int, floor,
      ceil, pow, pwr, min, max, sgn, ternary_fcn, gauss, agauss, unif,
      aunif, limit, var, vec). This parser does NOT accept V()/I()/time/
      temper/hertz references — those are illegal in ngspice's compile-time
      context per docs/GRAMMAR.md §0 (parser #1 "never sees solution
      variables"); rejecting them here IS the epic's job, not a follow-on.
    implementation:
      owner: coder-agent
      paths:
        - servers/core/src/expr/ngspice_compiletime.rs
      acceptance:
        - "parse_ngspice_compiletime(tokens) builds an Expr tree respecting the docs/GRAMMAR.md §4.3 precedence table: unary `-`/`!` tightest, then `** `/`^` (right-associative), then `* / % \\`, then `+ -`, then comparisons, then `&&`, then `||`, then `c?x:y` loosest."
        - "`**` and `^` both parse to the same power BinaryOp variant/tag in this ngspice compile-time parser."
        - "Every function name in the compile-time built-in list above is accepted as a Call with the documented arity where fixed (e.g. sqrt/sin/... are 1-arg, min/max/pow/pwr are 2-arg, gauss/agauss/unif/aunif are 2 or 3-arg per docs/GRAMMAR.md §4.3, ternary_fcn is 3-arg); an unrecognized function name still parses structurally as a Call (so a later semantic pass can diagnose it) rather than failing to parse."
        - "A V(...), I(...), or bare `time`/`temper`/`hertz` reference in this parser's input produces a diagnostic-carrying parse error, not a successful Expr — this is the parser #1/parser #2 boundary enforcement."
        - "Numeric-suffix scale factors from CORE-08 are applied so that `1k * 2` and `2000` evaluate structurally to the same Number-times-Number shape (i.e. the suffix is resolved to its multiplier at this layer, not left as an opaque string) — the AST stores the resolved f64 value; docs/GRAMMAR.md §2's decorative-trailing-letters rule already stripped noise at the tokenizer."
        - "Malformed input (unbalanced parens, trailing operator, empty function-call args where required) produces a diagnostic-carrying parse error with a span, not a panic."
    tests:
      owner: tester-agent
      paths:
        - servers/core/src/expr/ngspice_compiletime.rs   # #[cfg(test)] mod tests
      acceptance:
        - "one precedence test per adjacent pair of levels in the 8-level table, proving the tighter one binds first (e.g. `2+3*4` parses as `2+(3*4)`, not `(2+3)*4`)"
        - "test_double_star_and_caret_both_mean_power"
        - "test_power_is_right_associative (2**3**2 == 2**(3**2) shape)"
        - "one test per built-in function name, asserting Call arity"
        - "test_ternary_lowest_precedence (1+2==3?4:5+6 parses per docs/GRAMMAR.md §4.3 shape)"
        - "test_v_reference_rejected_in_compiletime_context"
        - "test_bare_time_identifier_rejected_in_compiletime_context"
