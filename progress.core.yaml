  - id: CORE-31
    title: Parse dialect-specific analysis/output statements
    area: statements-analysis-dialect-specific
    status: blocked
    blocked: >
      2026-07-31. Zero tests existed; added a full batch. Recognition of
      every listed keyword under its OWN dialect works correctly (.DISTO/
      .PZ/etc under ngspice; .STEP/.HB/etc under Xyce; .DATA/.ENDDATA
      bounded block; .MEASURE and .MEAS both spellings, both dialects) —
      all pass. But the two explicit cross-dialect-flagging acceptance
      bullets are both violated, confirmed by two permanent
      #[ignore]d regression tests:
      (1) servers/core/src/parser/xyce.rs is_xyce_analysis() (~line 117)
      merges the ngspice-only keyword list (.DISTO/.NOISE/.PZ/.SP/.FOUR/
      .PROBE/.WIDTH) directly into its own accepted-set with no diagnostic
      — a `.PZ` line under Dialect::Xyce is silently accepted as a valid
      Statement::Analysis{dialect_tag: "xyce"}, never flagged as
      ngspice-only. Test: parser::xyce::tests::
      test_ngspice_only_keyword_flagged_under_xyce.
      (2) servers/core/src/parser/ngspice.rs is_ngspice_analysis() (~line
      100) has NO Xyce-only-keyword list at all — a `.STEP` line under
      Dialect::Ngspice falls straight through to Statement::Unrecognized
      with zero explanation that it's Xyce-only (the "ngspice has no
      native .STEP" fact from docs/GRAMMAR.md §7 is not surfaced anywhere).
      Test: parser::ngspice::tests::
      test_xyce_only_keyword_flagged_under_ngspice.
      Fix needs: split is_xyce_analysis()'s keyword list into a
      Xyce-native set and a separate "known ngspice-only, reject with a
      named diagnostic" set (same shape needed in reverse for
      is_ngspice_analysis() plus a genuinely-new Xyce-only-keyword list it
      currently lacks entirely).
    depends_on: [CORE-30]
    summary: >
      Extend the `Statement` enum and both dialect parsers with the
      remaining analysis/output statements docs/GRAMMAR.md §7 documents as
      dialect-specific, captured structurally (raw argument list per
      statement, no semantic validation): ngspice-only — `.DISTO`, `.NOISE`,
      `.PZ`, `.SENS` (ngspice form), `.SP`, `.FOUR`, `.PROBE`, `.WIDTH`;
      Xyce-only — `.STEP`, `.HB`, `.LIN`, `.SAMPLING`, `.EMBEDDEDSAMPLING`,
      `.PCE`, `.DATA`/`.ENDDATA`, `.SENS` (Xyce form), `.RESULT`, `.SAVE`,
      `.PREPROCESS`, `.FFT`; both — `.MEASURE`/`.MEAS` (captured as one raw
      statement per docs/GRAMMAR.md §7's note that its sub-grammar is large
      and not confirmed field-for-field identical between dialects — do not
      attempt to model its TRIG-TARG/FIND-WHEN sub-forms in this epic).
      Given the sheer number of statement types here, prioritize correct
      *recognition* (not falling through to Unrecognized, and not
      cross-contaminating dialect-specific statements into the wrong
      dialect's accepted set) over deep per-statement argument modeling.
    implementation:
      owner: coder-agent
      paths:
        - servers/core/src/ast.rs
        - servers/core/src/parser/ngspice.rs
        - servers/core/src/parser/xyce.rs
      acceptance:
        - "Every statement name listed in the summary is recognized as a distinct, correctly-dialect-scoped `Statement` variant (or a shared `Statement::AnalysisOrOutput { keyword: String, raw_args: String }` catch-all variant, at the implementer's discretion, as long as the keyword and dialect-scoping are both preserved) rather than falling through to `Statement::Unrecognized`."
        - "An ngspice-only keyword (e.g. `.PZ`) encountered under Dialect::Xyce produces a diagnostic naming it as ngspice-only, rather than being silently accepted or silently falling to Unrecognized with no explanation."
        - "A Xyce-only keyword (e.g. `.STEP`, `.HB`) encountered under Dialect::Ngspice produces the mirror diagnostic — this directly encodes the confirmed finding from docs/GRAMMAR.md §7 that ngspice has no native `.STEP` (it's emulated via `.control` + `alter` + `run`, not a statement ngspice's grammar itself accepts)."
        - "`.DATA <name> ... .ENDDATA` (Xyce) is recognized as a bounded multi-line block (like `.SUBCKT`/`.ENDS`), not misparsed as a sequence of unrelated statements between the two markers."
        - "`.MEASURE`/`.MEAS` is recognized (both spellings, both dialects) and its full raw text captured as one statement, explicitly NOT decomposed into TRIG/TARG/FIND/WHEN sub-fields in this epic."
